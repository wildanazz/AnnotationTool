metadata:
  name: onnx-maritime-yolox
  namespace: cvat
  annotations:
    name: Maritime YOLOX
    type: detector
    spec: |
      [
        {
          "id": 0, "name": "ship", "type": "rectangle",
          "attributes": [
            { "name": "confidence", "input_type": "text", "values": [] }
          ]
        }
      ]
spec:
  description: Maritime object detector (YOLOX) via onnx
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s
  build:
    image: cvat.onnx.maritime.yolox
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        - kind: RUN
          value: apt-get update && apt-get install --no-install-recommends -y python3-pip python-is-python3 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip install onnxruntime opencv-python-headless numpy pillow pyyaml --no-cache-dir
        - kind: WORKDIR
          value: /opt/nuclio

  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
